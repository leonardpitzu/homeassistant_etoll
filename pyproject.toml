[project]
name = "homeassistant_etoll"
version = "2.2.0"
description = "Home Assistant custom integration for Romanian road tax (rovinietă) validity"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported
addopts = "-p no:respx"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports, syntax issues)
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear (common bug patterns)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long – leave to formatter / personal preference
    "W293",  # blank line contains whitespace
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.etoll"]
