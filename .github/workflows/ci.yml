name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff (the version pinned in requirements_test.txt)
        run: pip install "$(grep '^ruff==' requirements_test.txt)"
      - name: Check for errors
        run: ruff check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        # pytest-homeassistant pins the matching Home Assistant release.
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest tests/ -q --cov=custom_components/etoll --cov-report=term-missing

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
